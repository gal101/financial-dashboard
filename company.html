<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Companie - BVB</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
  .ch-top { display: grid; grid-template-columns: 300px 1fr; gap: 20px; margin-bottom: 20px; }
  @media(max-width:750px) { .ch-top { grid-template-columns: 1fr; } }
  .ch-left { display: flex; flex-direction: column; gap: 12px; }
  .ch-hdr { display: flex; align-items: baseline; gap: 8px; }
  .ch-hdr .sym { font-size: 1.2rem; font-weight: 700; color: var(--text); text-decoration: none; }
  .ch-hdr .name { font-size: .75rem; color: var(--dim); }
  .ch-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .ch-price { font-size: 1.5rem; font-weight: 700; }
  .ch-btn-group { display: flex; gap: 4px; flex-wrap: wrap; }
  .ch-btn-group button { background: var(--card); border: 1px solid var(--border); color: var(--dim); padding: 4px 10px; border-radius: 6px; font-size: .7rem; cursor: pointer; transition: all .15s; }
  .ch-btn-group button:hover { border-color: #818cf8; color: var(--text); }
  .ch-btn-group button.on { background: rgba(99,102,241,0.2); border-color: #818cf8; color: #c7d2fe; font-weight: 600; }
  .ch-toggle { display: inline-flex; background: var(--card); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-left: auto; }
  .ch-toggle button { background: none; border: none; color: var(--dim); padding: 4px 12px; font-size: .72rem; cursor: pointer; transition: all .15s; }
  .ch-toggle button.on { background: rgba(99,102,241,0.2); color: #c7d2fe; }
  .ch-right-col { display: flex; flex-direction: column; gap: 16px; justify-content: flex-end; }
  .ch-section-bar { display: flex; align-items: center; margin-bottom: 10px; }
  .ch-section-bar span { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
  .ch-news-btn { display: inline-block; margin-top: 2px; background: var(--accent-bg); color: var(--accent); border: 1px solid rgba(99,102,241,.3); border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: .72rem; text-decoration: none; }
  .ch-news-btn:hover { background: rgba(99,102,241,.25); }
  .ch-pct-badge { position: absolute; top: 8px; right: 12px; z-index: 2; padding: 3px 8px; border-radius: 10px; font-size: .68rem; font-weight: 700; pointer-events: none; }
  /* calendar scroll */
  #ch-cal-list > div { overflow-y: hidden !important; overflow-x: auto; }
  #ch-cal-list > div::-webkit-scrollbar { height: 3px; }
  #ch-cal-list > div::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .container { max-width: none; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 40px 40px; }
</style>
</head>
<body>

<div class="load" id="ld">
  <div style="text-align:center"><div class="spin" style="margin:0 auto 16px"></div>
  <div style="color:var(--dim);font-size:.9rem">Se incarca profilul companiei...</div></div>
</div>

<div class="container" id="ch-body" style="display:none">

  <!-- TOP: metrics left, chart+calendar right -->
  <div class="ch-top">
    <div class="ch-left">
      <div class="ch-hdr">
        <a href="dashboard.html" style="color:var(--dim);text-decoration:none;font-size:.8rem;margin-right:4px">&larr;</a>
        <span class="sym" id="ch-sym">-</span>
        <span class="name" id="ch-name"></span>
      </div>
      <div class="ch-tags" id="ch-tags"></div>
      <div class="ch-price" id="ch-price">-</div>
      <div style="font-size:.8rem" id="ch-change">-</div>
      <div class="mm-row" id="ch-metrics"></div>
      <a id="ch-news" href="#" target="_blank" class="ch-news-btn">&#128240; Stiri Google News</a>
    </div>
    <div class="ch-right-col">
      <!-- Calendar above price chart -->
      <div id="ch-cal-section" style="display:none">
        <div class="ch-section-bar"><span>&#128197; Calendar financiar</span></div>
        <div id="ch-cal-list"></div>
      </div>
      <div style="margin-top:28px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <div class="ch-btn-group" id="ch-period-btns">
            <button data-p="1wk">1S</button>
            <button data-p="1mo">1L</button>
            <button data-p="3mo">3L</button>
            <button data-p="6mo">6L</button>
            <button class="on" data-p="1y">1A</button>
            <button data-p="3y">3A</button>
            <button data-p="5y">5A</button>
          </div>
          <div class="ch-btn-group" id="ch-type-btns">
            <button class="on" data-t="line">Linie</button>
            <button data-t="range">Interval (Min-Max)</button>
          </div>
          <div id="ch-pct-badge" style="display:none;margin-left:auto;padding:3px 8px;border-radius:10px;font-size:.7rem;font-weight:700"></div>
        </div>
        <div style="position:relative">
          <div class="mc-wrap" style="height:240px"><canvas id="ch-price-chart"></canvas></div>
          <div id="ch-no-chart" style="display:none;text-align:center;padding:80px 20px;color:var(--dim);font-size:.8rem">Nu exista date pentru graficul de pret.</div>
        </div>
      </div>
    </div>
  </div>

  <!-- FINANCIAL CHARTS -->
  <div class="ch-section-bar">
    <span>Rezultate financiare</span>
    <div class="ch-toggle" id="ch-fin-toggle">
      <button class="on" data-mode="profit">Profit</button>
      <button data-mode="venituri">Venituri</button>
    </div>
  </div>
  <div class="mc-row">
    <div class="mc">
      <div style="font-size:.75rem;color:var(--dim);margin-bottom:6px">Anual</div>
      <div class="mc-wrap"><canvas id="ch-ann-chart"></canvas></div>
    </div>
    <div class="mc">
      <div style="font-size:.75rem;color:var(--dim);margin-bottom:6px">Trimestrial</div>
      <div class="mc-wrap"><canvas id="ch-q-chart"></canvas></div>
    </div>
  </div>
  <div id="ch-fin-empty" style="display:none;text-align:center;padding:30px;color:var(--dim);font-size:.8rem">Nu exista date financiare.</div>

  <div id="ch-error" style="display:none;text-align:center;padding:60px 20px;color:var(--dim)">
    <div style="font-size:3rem;margin-bottom:10px">&#128269;</div>
    <div style="font-size:1.2rem;font-weight:600;margin-bottom:8px">Compania nu a fost gasita</div>
    <div style="font-size:.85rem" id="ch-error-msg"></div>
    <a href="dashboard.html" class="ch-news-btn" style="display:inline-block;margin-top:12px;text-decoration:none">&larr; Inapoi la portofoliu</a>
  </div>
</div>

<script src="company_profile.js?v=20260601"></script>
</body>
</html>
